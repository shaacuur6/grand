{% extends "base.html" %}{% block content %}<h2>Low Stock</h2><div class="card"><table class="table"><thead><tr><th>Item</th><th>Unit</th><th>Current</th><th>Reorder Level</th></tr></thead><tbody>{% for x in items %}<tr><td>{{ x.name }}</td><td>{{ x.unit }}</td><td class="text-danger fw-bold">{{ x.current_stock }}</td><td>{{ x.reorder_level }}</td></tr>{% empty %}<tr><td colspan="4">No low-stock items.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
