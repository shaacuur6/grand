{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Food Categories</h2><a class="btn btn-primary" href="{% url 'category_add' %}">Add Category</a></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th></th></tr></thead><tbody>{% for x in categories %}<tr><td>{{ x.name }}</td><td><a class="btn btn-sm btn-outline-secondary" href="{% url 'category_edit' x.id %}">Edit</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'category_delete' x.id %}">Delete</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
