{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><div><h2>{{ supplier.name }}</h2><p>{{ supplier.phone }} · {{ supplier.email }}</p></div><div><a class="btn btn-outline-secondary" href="{% url 'supplier_update' supplier.id %}">Edit</a> <a class="btn btn-outline-danger" href="{% url 'supplier_delete' supplier.id %}">Delete</a></div></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table"><thead><tr><th>Purchase</th><th>Date</th><th>Total</th></tr></thead><tbody>{% for p in purchases %}<tr><td><a href="{% url 'purchase_detail' p.id %}">#{{ p.id }}</a></td><td>{{ p.date }}</td><td>${{ p.total_amount|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="3">No purchases.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
