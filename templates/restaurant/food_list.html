{% extends "base.html" %}

{% block content %}

<h2>Restaurant Menu</h2>

<table class="table table-hover">

<tr>
<th>Name</th>
<th>Category</th>
<th>Price</th>
<th>Actions</th>
</tr>

{% for item in items %}

<tr>

<td>{{ item.name }}</td>
<td>{{ item.category }}</td>
<td>{{ item.price }}</td>
<td><a href="{% url 'menu_edit' item.id %}" class="btn btn-outline-primary btn-sm">Edit</a></td>





</tr>

{% endfor %}

</table>

<a href="{% url 'menu_add' %}" class="btn btn-primary">
Create Order
</a>

{% endblock %}
