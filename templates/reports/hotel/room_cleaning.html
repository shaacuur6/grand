{% extends "base.html" %}{% block content %}<h2>{{ status_label }} Rooms</h2><div class="card border-0 shadow-sm"><table class="table"><thead><tr><th>Room</th><th>Type</th><th>Price</th><th>Status</th></tr></thead><tbody>{% for r in rooms %}<tr><td>{{ r.number }}</td><td>{{ r.room_type|title }}</td><td>${{ r.price|floatformat:2 }}</td><td>{{ r.status|title }}</td></tr>{% empty %}<tr><td colspan="4">No rooms.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
