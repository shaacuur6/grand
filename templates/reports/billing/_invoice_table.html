<div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table"><thead><tr><th>Invoice</th><th>Guest</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead><tbody>{% for r in report %}<tr><td><a href="{% url 'invoice_detail' r.invoice.id %}">#{{ r.invoice.id }}</a></td><td>{{ r.invoice.booking.guest }}</td><td>${{ r.total|floatformat:2 }}</td><td>${{ r.paid|floatformat:2 }}</td><td>${{ r.balance|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="5">No records.</td></tr>{% endfor %}</tbody></table></div></div>
