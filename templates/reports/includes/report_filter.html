<div class="card border-0 shadow-sm mb-3"><div class="card-body"><form method="get" class="row g-2">{% for field in form %}<div class="col-md-2">{{ field.label_tag }}{{ field }}</div>{% endfor %}<div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100">Filter</button></div></form>{% if form.non_field_errors %}<div class="alert alert-danger mt-2">{{ form.non_field_errors }}</div>{% endif %}</div></div>
