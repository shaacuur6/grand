{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow p-4">

        <h4>Update Payment</h4>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button class="btn btn-success">Update</button>
            <a href="{% url 'payment' object.invoice.booking.id %}" class="btn btn-secondary">Cancel</a>
        </form>

    </div>
</div>

{% endblock %}
