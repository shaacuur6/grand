<form method="get" class="card shadow-sm border-0 mb-4">
  <div class="card-header bg-primary text-white"><h5 class="mb-0"><i class="bi bi-funnel"></i> Report Filters</h5></div>
  <div class="card-body">
    {% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}
    <div class="row g-3">
      <div class="col-md-2"><label class="form-label">{{ form.start_date.label }}</label>{{ form.start_date }}</div>
      <div class="col-md-2"><label class="form-label">{{ form.end_date.label }}</label>{{ form.end_date }}</div>
      <div class="col-md-2"><label class="form-label">Checkout From</label>{{ form.check_out_from }}</div><div class="col-md-2"><label class="form-label">Checkout To</label>{{ form.check_out_to }}</div><div class="col-md-2"><label class="form-label">Room</label>{{ form.room }}</div>
      <div class="col-md-2"><label class="form-label">Room Type</label>{{ form.room_type }}</div>
      <div class="col-md-2"><label class="form-label">Status</label>{{ form.status }}</div>
      <div class="col-md-2"><label class="form-label">Guest</label>{{ form.guest }}</div>
      <div class="col-md-6"><label class="form-label">{{ form.search.label }}</label>{{ form.search }}</div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button class="btn btn-primary"><i class="bi bi-search"></i> Apply Filters</button>
      <a href="{{ request.path }}" class="btn btn-outline-secondary">Reset</a>
      <button type="button" class="btn btn-outline-dark" onclick="window.print()"><i class="bi bi-printer"></i> Print</button>
    </div>
  </div>
</form>
