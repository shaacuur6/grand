{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Suppliers</h2><a class="btn btn-primary" href="{% url 'supplier_create' %}">Add Supplier</a></div><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Name, contact or phone"></div><div class="col-md-2"><button class="btn btn-outline-primary">Search</button></div></form><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table"><thead><tr><th>Name</th><th>Contact</th><th>Phone</th><th>Email</th><th></th></tr></thead><tbody>{% for s in suppliers %}<tr><td>{{ s.name }}</td><td>{{ s.contact_person }}</td><td>{{ s.phone }}</td><td>{{ s.email }}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'supplier_detail' s.id %}">View</a> <a class="btn btn-sm btn-outline-secondary" href="{% url 'supplier_update' s.id %}">Edit</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
