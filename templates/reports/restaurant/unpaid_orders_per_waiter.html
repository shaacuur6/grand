{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">

            <h4>
                Unpaid Orders Per Waiter
            </h4>

        </div>

        <div class="card-body">

            <table class="table table-bordered">

                <thead class="table-dark">

                    <tr>

                        <th>Waiter</th>
                        <th>Unpaid Amount</th>

                    </tr>

                </thead>

                <tbody>

                    {% for row in report %}

                    <tr>

                        <td>
                            {{ row.waiter }}
                        </td>

                        <td class="fw-bold text-danger">

                            ${{ row.unpaid_total }}

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

{% endblock %}
