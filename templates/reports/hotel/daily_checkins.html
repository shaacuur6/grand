{% extends "base.html" %}{% block content %}<h2>Daily Check-ins</h2>{% include "reports/includes/report_filter.html" %}<div class="card border-0 shadow-sm"><table class="table"><thead><tr><th>Guest</th><th>Room</th><th>Check-in</th><th>Status</th></tr></thead><tbody>{% for b in bookings %}<tr><td>{{ b.guest }}</td><td>{{ b.room.number }}</td><td>{{ b.check_in }}</td><td>{{ b.status|title }}</td></tr>{% empty %}<tr><td colspan="4">No check-ins.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
