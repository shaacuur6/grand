{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Inventory</h2><a class="btn btn-primary" href="{% url 'inventoryitem_create' %}">Add Item</a></div><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Search item"></div><div class="col-md-2"><label class="form-check mt-2"><input class="form-check-input" type="checkbox" name="low" value="1" {% if request.GET.low %}checked{% endif %}> Low stock</label></div><div class="col-md-2"><button class="btn btn-outline-primary">Filter</button></div></form><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table"><thead><tr><th>Item</th><th>Unit</th><th>Stock</th><th>Reorder</th><th></th></tr></thead><tbody>{% for x in items %}<tr><td>{{ x.name }}</td><td>{{ x.unit }}</td><td class="{% if x.current_stock <= x.reorder_level %}text-danger fw-bold{% endif %}">{{ x.current_stock }}</td><td>{{ x.reorder_level }}</td><td><a class="btn btn-sm btn-outline-secondary" href="{% url 'inventoryitem_update' x.id %}">Edit</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'inventoryitem_delete' x.id %}">Delete</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
