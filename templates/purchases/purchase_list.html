{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Purchases</h2><a class="btn btn-primary" href="{% url 'purchase_add' %}">New Purchase</a></div><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="q" value="{{ request.GET.q }}" placeholder="Search supplier"></div><div class="col-md-2"><button class="btn btn-outline-primary">Search</button></div></form><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>#</th><th>Date</th><th>Supplier</th><th>Items</th><th>Total</th><th></th></tr></thead><tbody>{% for p in purchases %}<tr><td>#{{ p.id }}</td><td>{{ p.date }}</td><td>{{ p.supplier }}</td><td>{{ p.items.count }}</td><td>${{ p.total_amount|floatformat:2 }}</td><td><a class="btn btn-sm btn-outline-primary" href="{% url 'purchase_detail' p.id %}">View</a> <a class="btn btn-sm btn-outline-secondary" href="{% url 'purchase_update' p.id %}">Edit</a></td></tr>{% empty %}<tr><td colspan="6" class="text-center">No purchases.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
