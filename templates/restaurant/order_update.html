{% extends "base.html" %}{% block content %}<div class="card border-0 shadow-sm"><div class="card-body"><h3>Edit Order #{{ object.id }}</h3><form method="post">{% csrf_token %}<div class="row g-3 mb-3"><div class="col-md-4"><label>Table</label><input class="form-control" name="table_number" value="{{ object.table_number }}"></div><div class="col-md-4"><label>Booking</label><select class="form-select" name="booking"><option value="">—</option>{% for b in bookings %}<option value="{{ b.id }}" {% if object.booking_id == b.id %}selected{% endif %}>Room {{ b.room.number }} — {{ b.guest }}</option>{% endfor %}</select></div><div class="col-md-4"><label>Employee</label><select class="form-select" name="employee"><option value="">—</option>{% for e in employees %}<option value="{{ e.id }}" {% if object.employee_id == e.id %}selected{% endif %}>{{ e }}</option>{% endfor %}</select></div></div>{% for i in object.items.all %}<div class="row g-2 mb-2 align-items-end"><div class="col-md-4"><label>Food</label><select class="form-select" name="food_{{ i.id }}">{% for f in foods %}<option value="{{ f.id }}" {% if f.id == i.food_id %}selected{% endif %}>{{ f.name }} — ${{ f.price }}</option>{% endfor %}</select></div><div class="col-md-2"><label>Qty</label><input class="form-control" name="quantity_{{ i.id }}" value="{{ i.quantity }}" type="number" min="1"></div><div class="col-md-4"><label>Note</label><input class="form-control" name="note_{{ i.id }}" value="{{ i.description }}"></div><div class="col-md-2"><label>Delete</label><input class="form-check-input d-block mt-2" type="checkbox" name="delete_{{ i.id }}"></div></div>{% endfor %}<button class="btn btn-primary mt-3">Save</button> <a class="btn btn-secondary mt-3" href="{% url 'order_detail' object.id %}">Cancel</a></form></div></div>{% endblock %}
