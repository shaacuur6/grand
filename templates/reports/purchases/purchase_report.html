{% extends "base.html" %}{% block content %}<h2>Purchase Report</h2>{% include "reports/includes/report_filter.html" %}<div class="card"><table class="table"><thead><tr><th>Purchase</th><th>Date</th><th>Supplier</th><th>Total</th></tr></thead><tbody>{% for p in purchases %}<tr><td>#{{ p.id }}</td><td>{{ p.date }}</td><td>{{ p.supplier }}</td><td>${{ p.total_amount|floatformat:2 }}</td></tr>{% endfor %}</tbody><tfoot><tr><th colspan="3" class="text-end">Total</th><th>${{ total|floatformat:2 }}</th></tr></tfoot></table></div>{% endblock %}
