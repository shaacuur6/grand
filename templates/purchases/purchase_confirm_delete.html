{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="card shadow">

        <div class="card-header bg-danger text-white">
            <h4>Delete Purchase</h4>
        </div>

        <div class="card-body">

            <p>
                Are you sure you want to delete
                <strong>
                    Purchase #{{ object.id }}
                </strong>?
            </p>

            <p>
                Supplier:
                <strong>{{ object.supplier.name }}</strong>
            </p>

            <p>
                Total:
                <strong>{{ object.total_amount|floatformat:2 }}</strong>
            </p>

            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="btn btn-danger"
                >
                    Yes, Delete
                </button>

                <a
                    href="{% url 'purchase_detail' object.pk %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
