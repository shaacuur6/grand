{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Employees</h2><a class="btn btn-primary" href="{% url 'employee_add' %}">Add Employee</a></div><div class="card border-0 shadow-sm"><table class="table"><thead><tr><th>No.</th><th>Name</th><th>Phone</th><th>Position</th><th>Active</th><th></th></tr></thead><tbody>{% for e in employees %}<tr><td>{{ e.employee_no }}</td><td>{{ e.full_name }}</td><td>{{ e.phone }}</td><td>{{ e.position }}</td><td>{% if e.active %}Yes{% else %}No{% endif %}</td><td><a class="btn btn-sm btn-outline-secondary" href="{% url 'employee_edit' e.id %}">Edit</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'employee_delete' e.id %}">Delete</a></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
