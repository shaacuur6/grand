{% extends "base.html" %}

{% block content %}

<div class="container">

    <h3>Invoice Summary Report</h3>

    <table class="table table-bordered table-striped">

        <tr>

            <th>Invoice</th>
            <th>Guest</th>
            <th>Total</th>
            <th>Paid</th>
            <th>Balance</th>

        </tr>

        {% for row in report %}

        <tr>

            <td>{{ row.invoice.id }}</td>

            <td>
                {{ row.invoice.booking.guest }}
            </td>

            <td>${{ row.total }}</td>

            <td>${{ row.paid }}</td>

            <td>${{ row.balance }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
