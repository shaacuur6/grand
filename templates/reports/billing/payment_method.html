{% extends "base.html" %}

{% block content %}

<div class="container">

    <h3>Payment Method Report</h3>

    <table class="table table-bordered">

        <tr>

            <th>Method</th>
            <th>Total</th>

        </tr>

        {% for method in methods %}

        <tr>

            <td>{{ method.payment_method }}</td>
            <td>${{ method.total }}</td>

        </tr>

        {% endfor %}

    </table>

</div>

{% endblock %}
