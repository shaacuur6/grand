{% extends 'accounting/base_accounting.html' %}{% load money_tags %}{% block content %}<div class="d-flex justify-content-between mb-3"><h3>Journal Entries</h3><a class="btn btn-primary" href="{% url 'journal_add' %}">New journal entry</a></div><form class="row g-2 mb-3"><div class="col-md-3"><input class="form-control" name="q" placeholder="Search" value="{{request.GET.q}}"></div><div class="col-md-3"><input class="form-control" type="date" name="start" value="{{request.GET.start}}"></div><div class="col-md-3"><input class="form-control" type="date" name="end" value="{{request.GET.end}}"></div><div class="col-md-2"><button class="btn btn-outline-dark">Filter</button></div></form><div class="card"><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Date</th><th>Reference</th><th>Description</th><th>Source</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{e.date}}</td><td>{{e.reference}}</td><td><a href="{% url 'journal_detail' e.pk %}">{{e.description}}</a></td><td>{{e.source_type}}</td></tr>{% empty %}<tr><td colspan="4" class="p-4 text-center">No entries.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
