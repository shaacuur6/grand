{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <div class="card shadow-sm">

        <div class="card-header bg-success text-white">

            <h4 class="mb-0">

                {% if object %}
                    Edit Inventory Item
                {% else %}
                    Add Inventory Item
                {% endif %}

            </h4>

        </div>

        <div class="card-body">

            <form method="post">

                {% csrf_token %}

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Item Name
                        </label>

                        {{ form.name }}

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Unit
                        </label>

                        {{ form.unit }}

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Current Stock
                        </label>

                        {{ form.current_stock }}

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Reorder Level
                        </label>

                        {{ form.reorder_level }}

                    </div>

                </div>

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Save
                </button>

                <a
                    href="{% url 'inventoryitem_list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
