{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-dark text-white">

<h4>
Maintenance Report
</h4>

</div>

<div class="card-body">

<table class="table table-bordered table-striped">

<tr>

<th>Room #</th>
<th>Room Type</th>
<th>Status</th>

</tr>

{% for room in rooms %}

<tr>

<td>{{ room.number }}</td>
<td>{{ room.room_type }}</td>
<td>

<span class="badge bg-danger">

Maintenance

</span>

</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

{% endblock %}
