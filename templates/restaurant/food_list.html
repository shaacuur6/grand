{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between mb-3"><h2>Menu Items</h2><a class="btn btn-primary" href="{% url 'menu_add' %}">Add Food</a></div><div class="card border-0 shadow-sm"><div class="table-responsive"><table class="table"><thead><tr><th>Food</th><th>Category</th><th>Price</th><th></th></tr></thead><tbody>{% for x in items %}<tr><td>{{ x.name }}</td><td>{{ x.category }}</td><td>${{ x.price|floatformat:2 }}</td><td><a class="btn btn-sm btn-outline-secondary" href="{% url 'menu_edit' x.id %}">Edit</a> <a class="btn btn-sm btn-outline-danger" href="{% url 'menu_delete' x.id %}">Delete</a></td></tr>{% empty %}<tr><td colspan="4">No menu items.</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
