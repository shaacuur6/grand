{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

<div class="card shadow">

<div class="card-header bg-info text-white">

<h4>
Category Sales
</h4>

</div>

<div class="card-body">

<table class="table table-bordered">

<tr>

<th>Category</th>
<th>Total Sales</th>

</tr>

{% for row in categories %}

<tr>

<td>{{ row.category }}</td>
<td>${{ row.total }}</td>

</tr>

{% endfor %}

</table>

</div>

</div>

</div>

{% endblock %}
