{% extends "base.html" %}{% block content %}<h2>Table Sales</h2>{% include "reports/includes/report_filter.html" %}<div class="card"><table class="table"><thead><tr><th>Table</th><th>Orders</th><th>Sales</th></tr></thead><tbody>{% for r in tables %}<tr><td>{{ r.table_number|default:"Non-table" }}</td><td>{{ r.total_orders }}</td><td>${{ r.total_sales|floatformat:2 }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
